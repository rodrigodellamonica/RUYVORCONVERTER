name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair zip
        run: unzip -q RuyvorEdicaoDeVideos.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        working-directory: RuyvorEdicaoDeVideos
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RUYVOR-EDICAO-DE-VIDEOS-apk
          path: RuyvorEdicaoDeVideos/app/build/outputs/apk/debug/app-debug.apk
